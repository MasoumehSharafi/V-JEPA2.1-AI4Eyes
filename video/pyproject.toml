[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4eyes-video"
version = "0.1.0"
description = "V-JEPA2.1-based pipeline for AI4Eyes video clinical signs (NITBUT, Invasive-TBUT, Blink Mechanics)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
