# Domain-adaptive continued pretraining of V-JEPA 2.1 ViT-L/16 on the
# combined unlabeled AI4Eyes video pool (224px, 16-frame clips, 50 epochs).
# This is vjepa2's OWN config format (app.main --fname <this file>), not
# ai4eyes_video's -- scripts/pretrain_ssl.sh substitutes the __PLACEHOLDER__
# tokens below before launching.
app: vjepa_2_1
nodes: 1
tasks_per_node: 1
cpus_per_task: 4
mem_per_gpu: 24G
folder: __OUTPUT_FOLDER__
data:
  dataset_type: VideoDataset
  datasets:
    - __DATASET_CSV__
  batch_size: 24
  crop_size: 224
  patch_size: 16
  dataset_fpcs: [16]
  tubelet_size: 2
  fps: null
  frame_sample_rate: 4
  num_workers: 4
  persistent_workers: true
  pin_mem: true
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.8, 1.0]
  reprob: 0.0
loss:
  loss_exp: 1.0
  predict_all: true
  reg_coeff: 0.0
  shift_by_n: 0
  weight_distance_loss: true
mask:
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [1.0, 1.0]
meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: true
  read_checkpoint: null
  pretrained_encoder: __PRETRAINED_ENCODER__
  save_every_freq: -1
  seed: 239
  use_sdpa: true
  save_best: true
model:
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  is_causal: false
  lambda_value_img: 0.0
  lambda_value_vid: 0.5
  lambda_progressive: false
  local_window: [-1, -1, -1]
  modality_embedding: true
  model_name: vit_large
  n_registers: 0
  n_registers_predictor: 0
  normalize_predictor: false
  pred_depth: 12
  pred_embed_dim: 384
  pred_is_causal: false
  pred_local_window: [-1, -1, -1]
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  vit_conv: false
  zero_init_mask_tokens: true
optimization:
  ema: [0.996, 1.0]
  epochs: 50
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  ipe: null
  ipe_scale: 1.0
  lr: 0.00015
  start_lr: 1.0e-06
  warmup: 5
  weight_decay: 0.04
