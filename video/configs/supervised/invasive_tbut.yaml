# Invasive-TBUT: identical shape to NITBUT (single-class, one event per
# gradable video) -- same split, same patients, different ground truth.
test_type: INVASIVE_TBUT
classes: [INVASIVE_TBUT]
annotations_filename: invasive_tbut.json

window_frames: 160
resolution: 224
eval_overlap_ratio: 0.5

batch_size: 2
num_workers: 4
epochs: 60
lr: 1.0e-4
weight_decay: 0.05
log_interval: 20
checkpoint_interval: 5

backbone:
  model_name: vjepa2_1_vit_large_384
  checkpoint_key: ema_encoder
  num_frames: 16
  patch_size: 16
  tubelet_size: 2
  freeze: true

head:
  head_channels: 512
